<style>
:root{--navy:#1F2A44;--ink:#1d2433;--muted:#6b7385;--line:#e6e9f0;--bg:#f6f7fa;--orange:#F26B1D;--win:#1E7B34;--winbg:#E3F3E7;--med:#8A6100;--medbg:#FFF1CC;--bad:#C0392B;--badbg:#FBE0DD;--wait:#6B7385;--waitbg:#ECEEF2}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.18em;font-size:11px;opacity:.75}
header h1{margin:2px 0 0;font-size:18px;font-weight:600}
header a{color:#cfd4e0;font-size:13px;text-decoration:none}header a:hover{color:#fff}
.dummy{background:#FFF1CC;color:#6b5a12;font-size:13px;text-align:center;padding:8px}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;padding:10px 20px;overflow-x:auto;scrollbar-width:none}
nav a{flex:0 0 auto;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
nav a:hover{color:var(--navy);border-color:var(--navy)}
main{max-width:1040px;margin:0 auto;padding:22px 16px 80px}
section{margin-bottom:34px;scroll-margin-top:60px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-size:24px;line-height:1.25;margin:4px 0 6px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 16px;max-width:720px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.asof{font-size:13px;color:var(--muted)}
.sheet{background:var(--orange);color:#fff;text-decoration:none;font-weight:700;font-size:14px;border-radius:99px;padding:10px 18px}
.sheet:hover{background:#d95a12}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile .l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.stack{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:14px}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}

.briefs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.bf{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.code{background:var(--navy);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:4px 8px}
.bf .t{font-weight:600;color:var(--navy);font-size:14px}.bf .m{font-size:12px;color:var(--muted)}
.bf .bar{grid-column:1/-1;height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.bf .bar i{display:block;height:100%;background:var(--navy)}
.bf .f{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.funnel .r{display:grid;grid-template-columns:60px 1fr 120px;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.funnel .tr{height:26px;background:var(--bg);border-radius:7px;position:relative}
.funnel .fi{height:100%;border-radius:7px;background:#9aa6c0}

.funnel .val{text-align:right;font-weight:600}.funnel .off{color:var(--bad)}
.dims{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.dim h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dr{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 64px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.dr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .tr{height:18px;background:var(--bg);border-radius:5px}.dr .fi{height:100%;border-radius:5px;background:#c9ced8}
.dr.hi .fi{background:var(--win)}.dr .p{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dr .p small{color:var(--muted);font-weight:500}
.wins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.win h4{margin:8px 0 4px;font-size:15px;color:var(--navy)}
.win .q{font-size:14px;background:#FFF7EE;border-left:4px solid var(--orange);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}
.win .k{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.win .k b{color:var(--win)}
.win .why{font-size:13px;color:var(--muted);margin:8px 0 0}
.win a{font-size:13px;font-weight:600;color:var(--orange);text-decoration:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters select{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink)}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px;font-weight:600;font-size:12px}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.ins ul{margin:0;padding-left:18px}.ins li{margin:6px 0;font-size:14px}
.ins h3{margin:0 0 8px;font-size:15px;color:var(--navy)}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp = v => v == null || v === "" ? "–" : "Rp" + Math.round(v).toLocaleString("id-ID");
const num = v => v == null || v === "" ? "–" : Math.round(v).toLocaleString("id-ID");
const pct = v => Math.round(v * 100) + "%";
const jt = v => v >= 1e9 ? "Rp" + (v / 1e9).toFixed(2).replace(".", ",") + " M" : "Rp" + (v / 1e6).toFixed(1).replace(".", ",") + " jt";

if (D.dummy) $("#dummy").hidden = false;

const stColors = [["Winning", S.win, "#1E7B34", "#fff"], ["Mediocre", S.med, "#F2C94C", "#5b4a00"], ["Bad", S.bad, "#C0392B", "#fff"], ["Menunggu", S.wait, "#c9ced8", "#1F2A44"]];
const stTotal = stColors.reduce((a, s) => a + s[1], 0) || 1;
const kpiOf = x => (D.camps[x.camp] || {}).kpi;

function sumSec(){ return `<section id="ringkasan"><div class="top"><div class="asof">Data per ${esc(D.asof)} · sumber: Content Tracker</div>
  <a class="sheet" href="${esc(D.sheet)}" target="_blank" rel="noopener">Buka Content Tracker ↗</a></div>
  <div class="kicker">Ringkasan</div><h2>Kondisi konten saat ini</h2>

    <div class="card tile"><div class="l">Konten diupload</div><div class="v">${S.total}</div><div class="s">${D.briefs.length} brief</div></div>
    <div class="card tile"><div class="l">Sudah dinilai</div><div class="v">${S.judged}</div><div class="s">${S.wait} menunggu penilaian</div></div>
    <div class="card tile"><div class="l">Winning</div><div class="v" style="color:var(--win)">${S.win}</div><div class="s">win rate ${S.judged ? pct(S.win / S.judged) : "–"}</div></div>
    <div class="card tile"><div class="l">Total spend iklan</div><div class="v">${jt(S.spend)}</div><div class="s">seluruh konten</div></div>
  </div>
  <div class="card" style="margin-top:12px"><div class="kicker">Status konten</div>
    <div class="stack">${stColors.filter(s => s[1]).map(s => `<div style="width:${s[1] / stTotal * 100}%;background:${s[2]};color:${s[3]}">${s[0]} ${s[1]}</div>`).join("")}</div>
    <div class="legend"><span>Winning: hasil ≥ minimum & biaya per hasil ≤ KPI</span><span>Mediocre: ada hasil, belum lolos KPI</span><span>Bad: tanpa hasil</span><span>Menunggu: belum lewat masa penilaian</span></div></div></section>`; }

function briefSec(){ return `<section id="brief"><div class="kicker">Progress brief</div><h2>Brief & konten yang sudah masuk</h2>
  <p class="sub">Jumlah konten terupload dibanding target per brief, beserta konten yang sudah menang.</p>
  <div class="briefs">${D.briefs.map(b => `<div class="card bf"><div class="code">${esc(b.code)}</div><div><div class="t">${esc(b.sku)}</div><div class="m">${esc(b.camp)} · ${esc(b.template)}</div></div>
    <div class="bar"><i style="width:${Math.min(100, b.quota ? b.uploaded / b.quota * 100 : 0)}%"></i></div>
    <div class="f"><span>${b.uploaded} / ${b.quota} konten · deadline ${esc(b.deadline)}</span><span>${b.winning ? `<span class="st Winning">${b.winning} winning</span>` : ""}</span></div></div>`).join("")}</div></section>`; }

function funnelSec(){ const c = D.funnel.count, t = D.funnel.target, tot = (c.TOFU + c.MOFU + c.BOFU) || 1;
  return `<section id="funnel"><div class="kicker">Porsi funnel</div><h2>Keseimbangan TOFU · MOFU · BOFU</h2>
  <p class="sub">Porsi konten per tahap funnel dibanding target. Garis oranye = target.</p>
  <div class="card funnel">${["TOFU","MOFU","BOFU"].map(f => { const p = c[f] / tot, off = Math.abs(p - t[f]) >= .1;
    return `<div class="r"><b>${f}</b><div class="tr"><div class="fi" style="width:${p * 100}%"></div><div class="tg" style="left:calc(${t[f] * 100}% - 1px)"></div></div>
    <div class="val ${off ? "off" : ""}">${c[f]} konten · ${pct(p)}<br><small style="font-weight:500;color:var(--muted)">target ${pct(t[f])}</small></div></div>`; }).join("")}</div></section>`; }

function dimSec(){ return `<section id="pola"><div class="kicker">Pola yang menang</div><h2>Konten seperti apa yang menang?</h2>
  <p class="sub">Win rate = konten Winning ÷ konten yang sudah dinilai. Hijau = win rate ≥ 30%.</p>
  <div class="dims">${Object.entries(D.dims).map(([k, list]) => `<div class="card dim"><h3>${esc(k)}</h3>${list.map(d =>
    `<div class="dr ${d.r >= .3 ? "hi" : ""}"><div class="n" title="${esc(d.name)}">${esc(d.name)}</div><div class="tr"><div class="fi" style="width:${Math.max(3, d.r * 100)}%"></div></div>
     <div class="p">${pct(d.r)} <small>${d.w}/${d.n}</small></div></div>`).join("")}</div>`).join("")}</div></section>`; }

function winSec(){ const w = D.rows.filter(x => x.status === "Winning");
  return `<section id="winning"><div class="kicker">Konten winning</div><h2>${w.length} konten yang menang</h2>
  <p class="sub">Dasar untuk brief berikutnya: pola ini yang diperbanyak.</p>
  <div class="wins">${w.map(x => `<div class="card win"><span class="code">${esc(x.code)}</span> <span class="st Winning">Winning</span>
    <h4>${esc(x.sku)}</h4><div class="m" style="font-size:12px;color:var(--muted)">${esc(x.camp)} · ${esc(x.template)} · ${esc(x.hookType)}</div>
    <div class="q">“${esc(x.hook)}”</div>
    <div class="k"><span>Hasil</span><span>${num(x.result)} ${esc(x.metric)}</span></div>
    <div class="k"><span>Biaya per hasil</span><span><b>${rp(x.cpr)}</b> <small style="color:var(--muted)">KPI ${rp(kpiOf(x))}</small></span></div>
    ${x.note ? `<p class="why"><b style="color:var(--navy)">Kenapa menang:</b> ${esc(x.note)}</p>` : ""}
    ${x.link && x.link.startsWith("http") && !x.link.includes("…") ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">Lihat konten ↗</a>` : ""}</div>`).join("")}</div></section>`; }

let fSt = "Semua", fCamp = "Semua";
function allSec(){ const camps = ["Semua", ...new Set(D.rows.map(x => x.camp))];
  return `<section id="semua"><div class="kicker">Semua konten</div><h2>Daftar konten</h2>
  <div class="filters">${["Semua","Winning","Mediocre","Bad","Menunggu"].map(s => `<button data-st="${s}" class="${s === fSt ? "on" : ""}">${s}</button>`).join("")}
    <select id="fc">${camps.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
  <div class="tbl"><table><thead><tr><th>Kode</th><th>Upload</th><th>Campaign</th><th>Produk</th><th>Template</th><th>Hook</th><th>Spend</th><th>Hasil</th><th>Biaya/hasil</th><th>Status</th></tr></thead>
  <tbody id="tb"></tbody></table></div></section>`; }
function fillTable(){ $("#tb").innerHTML = D.rows.filter(x => (fSt === "Semua" || x.status === fSt) && (fCamp === "Semua" || x.camp === fCamp)).map(x =>
  `<tr><td style="white-space:nowrap"><b>${esc(x.code)}</b></td><td style="white-space:nowrap">${esc(x.dshort)}</td><td>${esc(x.camp)}</td><td>${esc(x.sku)}</td><td>${esc(x.template)}</td><td>${esc(x.hookType)}</td>
   <td class="num">${rp(x.spend)}</td><td class="num">${num(x.result)} <small style="color:var(--muted)">${esc(x.metric === "-" ? "" : x.metric)}</small></td>
   <td class="num">${rp(x.cpr)}</td><td>${x.status ? `<span class="st ${esc(x.status)}">${esc(x.status)}</span>` : `<span style="color:var(--muted)">organik</span>`}</td></tr>`).join("")
  || `<tr><td colspan="10" style="text-align:center;color:var(--muted)">Tidak ada konten</td></tr>`; }

function insSec(){ return `<section id="insight"><div class="kicker">Insight</div><h2>Insight & langkah berikutnya</h2>
  <div class="ins"><div class="card"><h3>Yang terlihat dari data</h3><ul>${D.insights.map(i => `<li>${i}</li>`).join("")}</ul></div>
  <div class="card"><h3>Langkah berikutnya</h3><ul>${D.next.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div></div></section>`; }

$("#app").innerHTML = sumSec() + briefSec() + funnelSec() + dimSec() + winSec() + allSec() + insSec();
fillTable();
document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { fSt = b.dataset.st; document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b)); fillTable(); });
$("#fc").onchange = e => { fCamp = e.target.value; fillTable(); };
</script></body></html>
